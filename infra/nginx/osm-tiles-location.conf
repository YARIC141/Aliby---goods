# server-контекст alliby.ru (подключается через include, см. infra/install-osm-tiles.sh)
# Тайлы OSM отдаются с нашего сервера; в кэше лежат 7 дней, потом обновляются с OSM.
# Если OSM недоступен — отдаём просроченный тайл (лучше старая карта, чем пустая).
location ~ "^/osm-tiles/(\d{1,2}/\d{1,6}/\d{1,6}\.png)$" {
    limit_req  zone=static burst=80 nodelay;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $osm_path $1;
    proxy_pass https://tile.openstreetmap.org/$osm_path;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "Alliby-tile-cache/1.0 (+https://alliby.ru)";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    proxy_cache osm_tiles;
    proxy_cache_key $osm_path;
    # Обновление раз в 7 дней: игнорируем заголовки OSM и держим 7 дней
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 10m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    add_header Cache-Control "public, max-age=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Cache-Status $upstream_cache_status always;
}
