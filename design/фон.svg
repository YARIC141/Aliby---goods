<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Основные градиенты для создания переливов -->
    <linearGradient id="darkPurpleGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f02a0" />
      <stop offset="60%" stop-color="#3e0dcc" />
      <stop offset="100%" stop-color="#6622e6" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20d7ff" />
      <stop offset="50%" stop-color="#5b98ff" />
      <stop offset="100%" stop-color="#7f3dfb" />
    </linearGradient>

    <linearGradient id="brightCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0addff" />
      <stop offset="100%" stop-color="#15c0ff" />
    </linearGradient>

    <linearGradient id="lightVioletGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e1ef2" />
      <stop offset="100%" stop-color="#2d05dd" />
    </linearGradient>

    <linearGradient id="tealBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0fe2ff" />
      <stop offset="100%" stop-color="#5856ff" />
    </linearGradient>

    <!-- Радиальный градиент для объемных капель -->
    <radialGradient id="radialViolet" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9956ff" />
      <stop offset="70%" stop-color="#6a1ef2" />
      <stop offset="100%" stop-color="#2c00c1" />
    </radialGradient>
  </defs>

  <!-- Чистый белый фон -->
  <rect width="1000" height="600" fill="#ffffff" />

  <!-- ================= ЗАДНИЙ ПЛАН (Темный и объемный) ================= -->
  <!-- Огромное темно-фиолетовое пятно (справа сверху) -->
  <path d="M 590 0
           C 650 0, 720 40, 780 80
           C 850 120, 920 160, 1000 180
           L 1000 0 Z" 
        fill="url(#darkPurpleGrad)" />

  <!-- Правое нижнее фиолетовое пятно -->
  <path d="M 1000 220
           C 980 200, 940 180, 900 190
           C 840 210, 780 260, 770 350
           C 760 420, 800 470, 850 490
           C 900 510, 960 500, 1000 460
           L 1000 220 Z" 
        fill="url(#lightVioletGrad)" />

  <!-- Глубокий фиолетовый слой (под правыми пятнами) -->
  <path d="M 1000 350
           C 950 360, 880 360, 830 410
           C 790 450, 810 520, 850 560
           C 900 600, 950 600, 1000 580
           L 1000 350 Z" 
        fill="#4d18de" opacity="0.8" />

  <!-- ================= ПЕРЕДНИЙ ПЛАН (Яркие и контрастные пятна) ================= -->
  
  <!-- Левая нижняя ярко-голубая масса -->
  <path d="M 0 350
           C 40 350, 90 360, 140 390
           C 180 420, 200 480, 180 530
           C 160 580, 130 600, 100 600
           L 0 600 Z" 
        fill="url(#brightCyanGrad)" />

  <!-- Переход фиолетового в голубое (слева) -->
  <path d="M 140 390
           C 200 390, 250 440, 280 490
           C 310 540, 330 580, 320 600
           L 100 600
           C 130 560, 150 500, 140 390 Z" 
        fill="url(#cyanBlueGrad)" opacity="0.9" />

  <!-- Большая светлая капля (внизу по центру) -->
  <path d="M 290 600
           C 290 520, 350 460, 420 440
           C 500 420, 560 460, 580 520
           C 600 580, 590 600, 590 600 Z" 
        fill="url(#tealBlueGrad)" />

  <!-- Фиолетовая капля-капля (слева, в форме груши) -->
  <path d="M 230 390
           C 245 340, 290 330, 315 350
           C 345 370, 365 410, 355 450
           C 345 485, 315 500, 285 485
           C 255 470, 220 440, 230 390 Z" 
        fill="url(#radialViolet)" />

  <!-- Яркое голубое пятно с фиолетовым отливом (справа по центру) -->
  <path d="M 640 130
           C 660 100, 690 100, 720 140
           C 760 190, 790 240, 780 280
           C 770 310, 740 300, 700 280
           C 660 260, 620 190, 640 130 Z" 
        fill="url(#cyanBlueGrad)" />

  <!-- Маленькая, но яркая капелька (справа) -->
  <path d="M 735 315
           C 745 310, 760 320, 775 345
           C 790 370, 805 395, 795 400
           C 780 405, 755 385, 740 360
           C 725 335, 725 320, 735 315 Z" 
        fill="url(#tealBlueGrad)" />

  <!-- Наложение полупрозрачного фиолетового на голубой для эффекта свечения -->
  <path d="M 590 300
           C 610 270, 640 260, 660 280
           C 680 300, 690 330, 680 360
           C 670 390, 640 400, 610 390
           C 580 380, 570 330, 590 300 Z" 
        fill="#8b48ff" opacity="0.15" />

  <!-- Правое нижнее наложение (осветление) -->
  <path d="M 1000 390
           C 970 395, 940 400, 910 430
           C 880 460, 880 500, 900 530
           C 920 560, 960 570, 1000 550
           L 1000 390 Z" 
        fill="#9d61ff" opacity="0.2" />

  <!-- Добавочный объем нижнему правому углу -->
  <path d="M 1000 500
           C 980 500, 950 510, 930 540
           C 910 570, 920 590, 940 600
           L 1000 600 Z" 
        fill="url(#brightCyanGrad)" opacity="0.4" />

</svg>